# 持续集成：把“我机器上是绿的”变成“任何一台干净机器上都绿”。
#
# 为什么需要它：`mvn clean verify` 的 233 个用例跑在**真实 MySQL** 上（原文要求，见
# TestDatabase 的类注释），它成立的前提是“有一个独立测试库 + 正确导出的
# BID_ARENA_TEST_DB_*”。在此之前，这条结论只在作者本机上成立：别人 clone 下来无法复现，
# 提交时也没有任何东西能自动发现“只在我机器上绿”。
#
# 为什么分成 5 个 job 而不是一条 run 到底：失败时的含义不同，读日志的人应该一眼知道该去查什么。
#   backend  —— 领域/集成/架构 233 个用例（服务容器提供一次性 MySQL 8.4）
#   frontend —— 类型检查 + 73 单测 + 生产构建（含 D-37 的同源 WS 开关）
#   e2e      —— 真起后端（8080/8090/18080）跑 tools/agent_sim.py 与 tools/auction_sim.py
#   config   —— Python 脚本可编译、compose 配置可解析、前端 nginx.conf 语法
#   images   —— 真正构建两个 Dockerfile（受限网络 + 本地无 Docker 的机器上无法验证的部分）
#
# 凭据：下面所有口令都是**CI 专用的一次性值**，只活在该 job 的服务容器里，与任何真实环境
# 无关；需要真实密钥的步骤一个都不存在（也不该存在）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: 后端 233 用例（真实 MySQL）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        # 与本地开发库同版本，避免“换个小版本就过/就不过”。
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: bid_arena_ci_pw
          # 独立测试库：库名必须与开发库不同，否则 TestDatabase 会拒绝启动（护栏见其类注释）。
          MYSQL_DATABASE: bid_arena_test
          MYSQL_USER: bid_arena
          MYSQL_PASSWORD: bid_arena_ci_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pbid_arena_ci_pw"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=24
    env:
      BID_ARENA_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/bid_arena_test?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false&characterEncoding=UTF-8
      BID_ARENA_TEST_DB_USER: bid_arena
      BID_ARENA_TEST_DB_PASSWORD: bid_arena_ci_pw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: mvn clean verify
        # 用 clean 而不是 mvn test：迁移脚本在仓库根目录 db/migration，增量构建可能让应用
        # 跑到旧副本（DEBUG_LOG.md DBG-2）。断言消息含中文，日志按 UTF-8 看。
        run: mvn -B clean verify
      - name: 断言用例数没有惄惄变少
        # 绿只说明“跑到的都过了”。用例数被过滤器/跳过悄悄减少时，绿色同样成立
        # （与 DBG-19 “永远为真的守卫”同类）。
        run: |
          got=$(grep -ho 'tests="[0-9]*"' target/surefire-reports/*.xml | grep -o '[0-9]*' | awk '{s+=$1} END{print s}')
          echo "surefire 总用例数：$got（期望 ≥ 233）"
          test "$got" -ge 233
      - name: 失败时上传 surefire 报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: 前端 73 单测 + 构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 与 frontend/Dockerfile 的构建镜像保持一致（FRONTEND_NODE_IMAGE 默认 node:22-alpine），
          # 免得“CI 用 24、镜像里用 22”这种只在一边暴露的问题。
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: 生产构建（打开同源 WS 开关，D-37）
        run: VITE_WS_SAME_ORIGIN=1 npm run build

  e2e:
    name: 端到端模拟（tools/*.py，真实双端口）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: bid_arena_ci_pw
          # 这一条跑的是**开发库**：两个脚本会创建拍卖、真的花钱（见 DBG-31），
          # 需要的就是种子账号与开发库的那套数据，所以不能指向测试库。
          MYSQL_DATABASE: bid_arena
          MYSQL_USER: bid_arena
          MYSQL_PASSWORD: bid_arena_ci_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pbid_arena_ci_pw"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=24
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/bid_arena?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false&characterEncoding=UTF-8&rewriteBatchedStatements=true
      DB_USER: bid_arena
      DB_PASSWORD: bid_arena_ci_pw
      JWT_SECRET: ci-only-jwt-secret-at-least-32-bytes-0123456789
      SERVER_PORT: '8080'
      AGENT_SERVER_PORT: '8090'
      WS_PORT: '18080'
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: 打包后端并复制运行时依赖
        # 与 Dockerfile 第 1 阶段的构建方式一致：非 fat jar，用 java -cp 启动。
        # 这里跳过测试：233 个用例已经由 backend job 负责，重复跑只会让反馈变慢。
        run: |
          mvn -B -q -DskipTests package
          mvn -B -q dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=target/libs
      - name: 启动后端并等健康检查
        run: |
          # setsid + nohup：让后端脱离本步骤的会话/进程组，避免它在后续步骤里被回收。
          setsid nohup java -cp "target/bid-arena-core-0.1.0-SNAPSHOT.jar:target/libs/*" com.bidarena.Application \
            > backend.log 2>&1 < /dev/null &
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/v1/health > /dev/null; then
              echo "后端就绪"
              exit 0
            fi
            sleep 2
          done
          echo "后端 120 秒内没有就绪，日志尾部如下"
          tail -50 backend.log
          exit 1
      - name: Agent 端到端（签发 → 读 → 出价 → 幂等重放 → 越权/过期/吊销/限流 → 结果）
        run: python tools/agent_sim.py
      - name: 复位演示数据
        # agent_sim.py 已经花掉了一部分余额，auction_sim.py 的前置检查要求可用余额 ≥ 400
        # （DBG-31）。直接 exec 进服务容器执行仓库里的复位脚本，不依赖宿主机装 mysql 客户端。
        run: |
          docker exec -i -e MYSQL_PWD=bid_arena_ci_pw ${{ job.services.mysql.id }} \
            mysql --default-character-set=utf8mb4 -uroot bid_arena < db/reset_demo_data.sql
      - name: 用户侧全链路（并发同/邻价、幂等重试、狙击、断线快照、结算核对）
        run: python tools/auction_sim.py
      - name: 失败时上传后端日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend.log
          if-no-files-found: ignore

  config:
    name: 配置与脚本自检
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python 脚本可编译
        run: python -m py_compile tools/*.py frontend/tools/*.py
      - name: compose 配置可解析
        # JWT_SECRET 在 docker-compose.yml 里是 ${JWT_SECRET:?...} 必填项，所以要先备一份 .env。
        run: |
          cp .env.example .env
          sed -i 's/^JWT_SECRET=.*/JWT_SECRET=ci-only-jwt-secret-at-least-32-bytes-0123456789/' .env
          docker compose config -q
      - name: 前端 nginx.conf 语法（单 origin 反代，D-37）
        run: |
          docker run --rm -v "$PWD/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t

  images:
    name: 构建两个镜像并整栈起来跑一遍
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: docker compose build（backend + frontend）
        # 这一步补的是本地验证不了的缺口：Docker daemon 在远程 VM、连不上 Docker Hub，
        # 本地镜像源里也没有 maven / node / temurin，所以“镜像能不能构建”此前没有证据。
        run: |
          cp .env.example .env
          sed -i 's/^JWT_SECRET=.*/JWT_SECRET=ci-only-jwt-secret-at-least-32-bytes-0123456789/' .env
          docker compose build
      - name: 断言镜像里真有产物
        # `docker compose build` 在“没有可构建的服务”时也会退 0，所以只看它成功不算证据。
        run: |
          docker image inspect bid-arena-backend:local bid-arena-frontend:local > /dev/null
          docker run --rm --entrypoint sh bid-arena-backend:local -c 'ls -l /app/app.jar; ls /app/libs/*.jar | wc -l'
          docker run --rm --entrypoint sh bid-arena-frontend:local -c 'ls -l /usr/share/nginx/html/index.html; nginx -t'
      - name: 整栈起来跑一遍（compose + 反代）
        # 此前 `docker-compose.yml` 只有 `docker compose config` 与 `nginx -t` 级验证，没有任何一次真的
        # 把它拉起来。这里验的正是 D-37 想收成一个入口的东西：前端静态页、`/api` 反代、后端健康端点。
        # 只看 HTTP 状态与内容，不依赖种子数据（空库自动建表、Flyway 迁移）。
        run: |
          set -o pipefail
          # 把 up 自身的输出留在文件里：compose 报的错（依赖没起来、构建失败）不在任何容器日志里，
          # 失败时必须能拿到它，否则看的人只有一行“exit code 1”。
          if ! docker compose up -d --build > /tmp/compose-up.log 2>&1; then
            echo "::error title=compose up 失败::$(tail -c 800 /tmp/compose-up.log | tr '\n' '|')"
            docker compose ps -a || true
            exit 1
          fi
          tail -3 /tmp/compose-up.log
          ok=
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/v1/health > /dev/null; then ok=1; break; fi
            sleep 2
          done
          [ -n "$ok" ] || { echo "::error title=后端 120 秒内没起来::$(docker compose ps -a | tr '\n' '|')"; docker compose logs --no-color --tail 60; exit 1; }
          echo "--- 后端直连 :8080 ---";        curl -fsS http://localhost:8080/api/v1/health; echo
          echo "--- 反代 :8088/api ---";        curl -fsS http://localhost:8088/api/v1/health; echo
          echo "--- 前端静态页 :8088 ---";      curl -fsS http://localhost:8088/ | head -c 300; echo
          docker compose ps
      - name: 断言迁移是一步独立完成的，应用只校验不迁移（D-39）
        # 光看“容器起来了”不能证明这件事。真正要看的只有两点：一次性迁移服务确实跑过并退了 0，
        # 而应用侧走的是“只校验”那条路，而不是自己又把迁移跑了一遍。
        run: |
          docker compose ps -a
          # 1) migrate 服务退出码为 0——backend 的启动就挂在这个退出码上（service_completed_successfully）。
          cid=$(docker compose ps -aq migrate)
          code=$(docker inspect -f '{{.State.ExitCode}}' "$cid")
          [ "$code" = "0" ] || { echo "migrate 服务退出码不是 0：$code"; docker compose logs --no-color migrate; exit 1; }
          # 2) 它确实做了事（不是因为配置漏了而空转）。
          docker compose logs --no-color migrate | tail -20
          docker compose logs --no-color migrate | grep -qE "已执行 [0-9]+ 个迁移|数据库结构已是最新版本" \
            || { echo "migrate 服务没有输出迁移结论"; exit 1; }
          # 3) 应用侧走的是“只校验”：这行日志只有 MIGRATE_ON_START=false 才会打。
          docker compose logs --no-color backend | grep -q "MIGRATE_ON_START=false" \
            || { echo "backend 没有走只校验路径（是不是有人删了 compose 里的 MIGRATE_ON_START？）"; exit 1; }
      - name: 失败时导出容器日志（并把关键几行折进 annotation）
        # annotation 是检查结果页上就能看到的，不必下载日志。把最可能出错的两处折进去，
        # 省一次“改 CI 再跑一轮”才能看到原因。
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --no-color --tail 80 || true
          echo "::error title=容器状态::$(docker compose ps -a --format '{{.Service}} {{.State}}' 2>/dev/null | tr '\n' '|')"
          echo "::error title=migrate 日志::$(docker compose logs --no-color migrate 2>&1 | tail -12 | tr '\n' '|' | head -c 900)"
          echo "::error title=backend 日志::$(docker compose logs --no-color backend 2>&1 | tail -12 | tr '\n' '|' | head -c 900)"
