# Bid Arena 运行时配置
#
# 这里只放"服务怎么跑"的参数。数据的取值清单在 .env.example（唯一权威），
# 数据库连接、迁移、结算扫描间隔等在 bootstrap/DatabaseBootstrap 里读取并带默认值。
#
# 端口写成 ${环境变量:默认值}：同一份构建产物在本机、容器与测试里都能靠环境变量换端口，
# 不必重新打包。默认值必须与 .env.example 一致，否则"没设变量"与"设了变量"会是两种行为。
server:
  port: ${SERVER_PORT:8080}
  # WebSocket 单独监听一个端口（Solon 的框架默认是 HTTP 端口 + 10000）。
  # 这里显式写出来而不是依赖那个偏移：偏移值必须让前端也知道，
  # 而"再算一次加法"在前端是一处静默的错误来源。改端口只改这一个地方。
  websocket:
    port: ${WS_PORT:18080}
