# 单 origin 入口：托管前端静态产物，并把 /api 与 /ws 转给后端。
#
# 与后端容器用服务名互连（compose 默认网络），端口用**容器内**端口：
#   backend:8080  —— 用户/管理 HTTP API
#   backend:18080 —— WebSocket 独立监听器
#
# 刻意**不**代理 Agent API（:8090）：它靠独立端口 + 独立凭据控制爆炸半径（D-9/D-29），
# 收进公网 origin 会把这条隔离抹掉。Agent 仍由使用者直连 :8090。
#
# 详见 DECISIONS.md D-37 与 docs/openapi.yaml 的 WsTicket。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 产物文件名带内容哈希：可长期缓存。index.html 不缓存，保证发版即生效。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA：前端用 view 状态切换而非多页路由，未命中的路径一律回 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # 用变量 + Docker 内嵌 DNS（127.0.0.11）：未用变量时 Nginx 会在**启动时**解析 `backend`，
        # 后端未就绪或重建（IP 变化）都会让 Nginx 起不来/连旧 IP。变量形式把解析推迟到请求时，
        # 配合 depends_on 就再没有启动顺序窗口。
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream backend:8080;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket 握手依赖 Upgrade/Connection 两个头：缺了会得到 400，而不是“连不上”。
    # 拍卖可能长时间没有上行帧，读/写超时放宽，别让反代先掐断长连接。
    location /ws/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ws_upstream backend:18080;
        proxy_pass http://$ws_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
