openapi: 3.0.3
info:
  title: Bid Arena API
  version: 0.1.0
  description: |
    拍卖间 HTTP 契约。金额为整数积分，ID 使用字符串，服务端是唯一裁判。

    所有响应（含 4xx/5xx）都是 Envelope 封套。出价的幂等键以下面 BidRequest.requestId
    为准；Idempotency-Key 头是等价的可选写法，两者都提供时必须一致。

    两个约定，写在前端接入前：
    1) 【字段缺失】与【值为 null】是同一件事：客户端不得用 in/keys 判断字段是否存在。
       服务端**可能**输出 `"winner": null`，也**可能**直接省略它（例：取消的拍卖结果里没有 winner），
       两者的语义都是“这一场没有中标人”。不要依赖其中之一，只判断“取不到或为 null”。
    2) 成功码有两种：OK 与 IDEMPOTENCY_REPLAY（都是 HTTP 200）。重放不是错误，
       但客户端应当用它提示“本次提交已按首次结果处理”，而不是当成新成交。

    实时事件走 WebSocket，不在本文件里描述消息体：事件信封与事件类型见
    docs/REALTIME_AND_COMMAND_FLOW.md（§3 信封、§4 事件表、§6 缺口恢复）。
    这里只固定它的**入口**：POST /auth/ws-tickets 换一次性票，再用票连 WS。
servers:
  - url: http://localhost:8080/api/v1
tags:
  - name: Auth
  - name: Auctions
  - name: Bids
  - name: Wallet
  - name: Admin
  - name: Agent
  - name: AgentTokens
  - name: AgentProxies
paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {$ref: '#/components/responses/EnvelopeAuth'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/ws-tickets:
    post:
      tags: [Auth]
      security: [{bearerAuth: []}]
      operationId: createWebSocketTicket
      description: |
        领一张一次性 WebSocket 入场券（默认 60 秒有效）。

        为什么不让客户端把 JWT 直接放进 WS 的 URL：浏览器无法在 WebSocket 握手上自定义头，
        令牌只能进查询串，而查询串会落进访问日志与浏览器历史——把一个长效凭证留在日志里。
        换成一次性短票后，日志里最坏只会留下一个已作废的字符串。

        用法：拿到 ticket 后连 `ws(s)://<host>:<wsPort>/ws/auctions/{auctionId}?ticket=<ticket>`。
        票只能核销一次，重复使用会被拒绝（先收到 CONNECTION_STATE(connected=false)，再被断开）。
      responses:
        '200': {$ref: '#/components/responses/EnvelopeWsTicket'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /users/me:
    get:
      tags: [Auth]
      security: [{bearerAuth: []}]
      operationId: currentUser
      responses:
        '200': {$ref: '#/components/responses/EnvelopeUser'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /wallets/me:
    get:
      tags: [Wallet]
      security: [{bearerAuth: []}]
      operationId: currentWallet
      responses:
        '200': {$ref: '#/components/responses/EnvelopeWallet'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /wallets/me/ledger:
    get:
      tags: [Wallet]
      security: [{bearerAuth: []}]
      operationId: walletLedger
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200': {$ref: '#/components/responses/EnvelopeLedgerPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auctions:
    get:
      tags: [Auctions]
      security: [{bearerAuth: []}]
      operationId: listAuctions
      parameters:
        - in: query
          name: status
          schema: {$ref: '#/components/schemas/AuctionStatus'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200': {$ref: '#/components/responses/EnvelopeAuctionPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auctions/{auctionId}:
    get:
      tags: [Auctions]
      security: [{bearerAuth: []}]
      operationId: getAuction
      parameters: [{$ref: '#/components/parameters/AuctionId'}]
      responses:
        '200': {$ref: '#/components/responses/EnvelopeAuction'}
        '404': {$ref: '#/components/responses/NotFound'}
  /auctions/{auctionId}/join:
    post:
      tags: [Auctions]
      security: [{bearerAuth: []}]
      operationId: joinAuction
      parameters: [{$ref: '#/components/parameters/AuctionId'}]
      responses:
        '200': {$ref: '#/components/responses/EnvelopeParticipant'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /auctions/{auctionId}/bids:
    get:
      tags: [Bids]
      security: [{bearerAuth: []}]
      operationId: listBids
      parameters:
        - {$ref: '#/components/parameters/AuctionId'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200': {$ref: '#/components/responses/EnvelopeBidPage'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Bids]
      security: [{bearerAuth: []}]
      operationId: placeBid
      description: |
        提交出价。幂等键以请求体的 requestId 为准；也可以用 Idempotency-Key 头代替。
        重复提交同一个幂等键时返回**首次**结果，code 为 IDEMPOTENCY_REPLAY（HTTP 仍是 200），
        客户端据此可以安全重试。
      parameters:
        - {$ref: '#/components/parameters/AuctionId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BidRequest'}
      responses:
        '200': {$ref: '#/components/responses/EnvelopeBidResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /auctions/{auctionId}/result:
    get:
      tags: [Auctions]
      security: [{bearerAuth: []}]
      operationId: auctionResult
      parameters: [{$ref: '#/components/parameters/AuctionId'}]
      responses:
        '200': {$ref: '#/components/responses/EnvelopeResult'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/auctions:
    post:
      tags: [Admin]
      security: [{bearerAuth: []}]
      operationId: createAuction
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAuctionRequest'}
      responses:
        '201': {$ref: '#/components/responses/EnvelopeAuction'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/auctions/{auctionId}/start:
    post:
      tags: [Admin]
      security: [{bearerAuth: []}]
      operationId: startAuction
      parameters: [{$ref: '#/components/parameters/AuctionId'}]
      responses:
        '200': {$ref: '#/components/responses/EnvelopeAuction'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /admin/auctions/{auctionId}/cancel:
    post:
      tags: [Admin]
      security: [{bearerAuth: []}]
      operationId: cancelAuction
      parameters: [{$ref: '#/components/parameters/AuctionId'}]
      responses:
        '200': {$ref: '#/components/responses/EnvelopeAuction'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /admin/auctions/{auctionId}/ledger:
    get:
      tags: [Admin]
      security: [{bearerAuth: []}]
      operationId: auctionLedger
      description: |
        管理员按场次查看**全部**资金流水，用于确认“最后成交的是 AI 还是人”。
        每条流水的 `actorType`（HUMAN/AGENT）标识该笔资金动作的主体。
        普通用户无权访问此路由，只能通过 `/wallets/me/ledger` 看到自己的流水。
      parameters:
        - {$ref: '#/components/parameters/AuctionId'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200': {$ref: '#/components/responses/EnvelopeLedgerPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/agent-tokens:
    get:
      tags: [Admin]
      security: [{bearerAuth: []}]
      operationId: listAgentTokens
      description: |
        管理员总览全部已签发的 Agent Token（**不含明文**），用于审计“现在还有哪些 Agent
        能替谁出价”。明文只在签发响应里出现一次，之后无法取回。
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200': {$ref: '#/components/responses/EnvelopeAgentTokenPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Admin]
      security: [{bearerAuth: []}]
      operationId: createAgentToken
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAgentTokenRequest'}
      responses:
        '201': {$ref: '#/components/responses/EnvelopeAgentToken'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/agent-tokens/{tokenId}/revoke:
    post:
      tags: [Admin]
      security: [{bearerAuth: []}]
      operationId: revokeAgentToken
      description: |
        吊销一枚 Agent Token。**幂等**：重复吊销同一枚仍然返回 200（首次吊销的时间戳不变），
        因为“让它变成已吊销”是一个可以安全重试的指令；未知 tokenId 才是 404。

        响应里的 `token` 恒为 null（吊销后自然拿不回明文），保留该字段只为与签发响应同形。
      parameters:
        - in: path
          name: tokenId
          required: true
          schema: {type: string}
      responses:
        '200': {$ref: '#/components/responses/EnvelopeAgentToken'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /me/agent-tokens:
    get:
      tags: [AgentTokens]
      security: [{bearerAuth: []}]
      operationId: listMyAgentTokens
      description: |
        本人已授权的竞拍 Agent Token 列表（新→旧）。**只返回属于自己的授权，不含明文**：
        明文只在签发响应的那一刻出现，之后无法取回。`status` 由服务端按当前时刻判定
        （ACTIVE / EXPIRED / REVOKED），客户端不要自行比时间（同 D-27 的口径）。
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200': {$ref: '#/components/responses/EnvelopeAgentTokenPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [AgentTokens]
      security: [{bearerAuth: []}]
      operationId: createMyAgentToken
      description: |
        为自己签发一枚竞拍 Agent Token（自助授权，见 DECISIONS D-34）。
        归属恒为当前登录用户——请求体里没有 `agentUserId`，因此“替别人签发”在契约层面无法表达。
        `auctionIds` 省略即“默认拒绍”（D-29）；明文只在本次响应里出现一次。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateMyAgentTokenRequest'}
      responses:
        '201': {$ref: '#/components/responses/EnvelopeAgentToken'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /me/agent-tokens/{tokenId}/revoke:
    post:
      tags: [AgentTokens]
      security: [{bearerAuth: []}]
      operationId: revokeMyAgentToken
      description: |
        吊销自己的 Agent Token。**幂等**（重复吊销仍返回 200）。
        不属于本人的 tokenId 返回 404，与“不存在”不可区分，避免拿吊销接口探测他人的 tokenId。
      parameters:
        - in: path
          name: tokenId
          required: true
          schema: {type: string}
      responses:
        '200': {$ref: '#/components/responses/EnvelopeAgentToken'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /me/agent-proxies:
    get:
      tags: [AgentProxies]
      security: [{bearerAuth: []}]
      operationId: listMyAgentProxies
      description: |
        我创建的托管 AI 代理。只返回当前登录用户名下的那些。
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200': {$ref: '#/components/responses/EnvelopeAgentProxyPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [AgentProxies]
      security: [{bearerAuth: []}]
      operationId: createAgentProxy
      description: |
        在一场**正在进行或尚未开始**的拍卖上创建托管代理：服务端替这个用户按最小加价跟价，
        直到预算上限（`budgetLimit`）为止。

        - 归属恒为当前用户：请求体里没有 `agentUserId`，也没有任何策略参数。
        - 同一场同一人只有一个代理位（`409 CONFLICT`）；撤销后重建会**重置同一个位置**。
        - `budgetLimit` 必须 ≤ 当前可用额（`409 INSUFFICIENT_BALANCE`）。AI 出价会**真实冻结**资金，
          但创建时**不**预冻结——只有在真正出价的那一刻才动钱。
        - 代理**同样受尾段博弈时间约束**：截止前 20 秒内它无法出价（D-32），没有例外。
          前端必须在创建时说清楚这一点，否则用户会以为“我的 AI 坏了”。
        - 允许建在 `DRAFT` 上：拍卖开拍后代理自动进场；配合 `startsAt` 预告开拍即为“时间到自动入场”。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAgentProxyRequest'}
      responses:
        '201': {$ref: '#/components/responses/EnvelopeAgentProxy'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /me/agent-proxies/{proxyId}/revoke:
    post:
      tags: [AgentProxies]
      security: [{bearerAuth: []}]
      operationId: revokeAgentProxy
      description: |
        撤销自己的 AI 代理：立即停止跟价（已经出价成交的结果不受影响）。
        不属于本人的 `proxyId` 返回 404，与“不存在”不可区分。
      parameters:
        - in: path
          name: proxyId
          required: true
          schema: {type: string}
      responses:
        '200': {$ref: '#/components/responses/EnvelopeAgentProxy'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/agent-proxies:
    get:
      tags: [AgentProxies]
      security: [{bearerAuth: []}]
      operationId: listAgentProxies
      description: |
        全局总览：便于排障时回答“现在有哪些 AI 在替人出价”。
        只读——**不提供**管理员代建代理或改预算的能力，那等于让运营替用户消耗资金。
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200': {$ref: '#/components/responses/EnvelopeAgentProxyPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /agent/auctions/{auctionId}:
    servers:
      - url: http://localhost:8090/api/v1
    get:
      tags: [Agent]
      security: [{agentToken: []}]
      operationId: agentAuction
      description: |
        读取竞拍快照。**这把接口同时也在 8080 上可用**；8090 只是额外的一个最小暴露面，
        它上面除了 /agent/** 之外的一切路径都返回 404 封套（连 /health 也没有）。

        Agent 凭证的三个失败码分工：401 = 不认识/已过期/已吊销（不区分原因，避免试探）；
        403 = 凭证有效但越权（缺权限，或这场拍卖不在 auctionIds 里）；429 = 超出该 Token 的频率上限。
      parameters: [{$ref: '#/components/parameters/AuctionId'}]
      responses:
        '200': {$ref: '#/components/responses/EnvelopeAuction'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /agent/auctions/{auctionId}/bids:
    servers:
      - url: http://localhost:8090/api/v1
    post:
      tags: [Agent]
      security: [{agentToken: []}]
      operationId: agentBid
      parameters:
        - {$ref: '#/components/parameters/AuctionId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BidRequest'}
      responses:
        '200': {$ref: '#/components/responses/EnvelopeBidResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /agent/auctions/{auctionId}/result:
    servers:
      - url: http://localhost:8090/api/v1
    get:
      tags: [Agent]
      security: [{agentToken: []}]
      operationId: agentAuctionResult
      parameters: [{$ref: '#/components/parameters/AuctionId'}]
      responses:
        '200': {$ref: '#/components/responses/EnvelopeResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
    agentToken: {type: http, scheme: bearer, bearerFormat: AUCTION_AGENT_TOKEN}
  parameters:
    AuctionId: {in: path, name: auctionId, required: true, schema: {type: string}}
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      description: |
        幂等键的可选写法。优先使用 BidRequest.requestId；只有本头而无 requestId 时以本头为准，
        两者同时出现且不一致时返回 400 VALIDATION_FAILED（因为无法判断调用方真实意图，
        猜错会把一次重试当成新出价，造成重复冻结）。
      schema: {type: string, minLength: 8, maxLength: 128}
    Page: {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
    Size: {in: query, name: size, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
  schemas:
    Envelope:
      type: object
      required: [code, message, data, requestId]
      properties:
        code: {$ref: '#/components/schemas/ApiCode'}
        message: {type: string, example: ok}
        data: {}
        requestId: {type: string}
    ApiCode:
      description: |
        业务结果码，所有响应的 code 字段取值。HTTP 状态码与之一一对应：
        OK=200；VALIDATION_FAILED=400；UNAUTHENTICATED=401；FORBIDDEN/HUMAN_ONLY_PERIOD=403；
        NOT_FOUND=404；METHOD_NOT_ALLOWED=405；其余冲突类=409；RATE_LIMITED=429；INTERNAL_ERROR=500。
        客户端应以 code 判定业务结果，不要只依赖 HTTP 状态码。
        两个成功码 OK 与 IDEMPOTENCY_REPLAY 都对应 200。
      type: string
      enum:
        - OK
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - INVALID_STATE
        - BID_TOO_LOW
        - BID_LATE
        - HUMAN_ONLY_PERIOD
        - NOT_JOINED
        - INSUFFICIENT_BALANCE
        - IDEMPOTENCY_REPLAY
        - CONFLICT
        - METHOD_NOT_ALLOWED
        - RATE_LIMITED
        - INTERNAL_ERROR
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password, minLength: 8}
    AuthData:
      type: object
      required: [accessToken, expiresAt, user]
      properties:
        accessToken: {type: string}
        expiresAt: {type: string, format: date-time}
        user: {$ref: '#/components/schemas/User'}
    User:
      type: object
      required: [id, name, role]
      properties:
        id: {type: string}
        name: {type: string}
        role: {type: string, enum: [BIDDER, ADMIN]}
    AuctionStatus: {type: string, enum: [DRAFT, RUNNING, SETTLING, FINISHED, CANCELLED]}
    AuctionSnapshot:
      type: object
      required: [id, title, status, startPrice, minIncrement, currentPrice, extensionCount, participantCount, seq, finalGameWindowSeconds, serverTime]
      properties:
        id: {type: string}
        title: {type: string}
        description: {type: string}
        status: {$ref: '#/components/schemas/AuctionStatus'}
        startPrice: {type: integer, minimum: 0}
        minIncrement: {type: integer, minimum: 1}
        currentPrice: {type: integer, minimum: 0}
        leader: {type: string, nullable: true}
        endsAt: {type: string, format: date-time, nullable: true}
        startsAt:
          type: string
          format: date-time
          nullable: true
          description: |
            预告开拍时间。缺席/为 null 表示“只等管理员手动开始”。
            它不参与出价、延时或结算的任何判定，纯粹是排期；真正开拍时才用时长换算出 endsAt。
        extensionCount: {type: integer, minimum: 0}
        participantCount: {type: integer, minimum: 0}
        seq: {type: integer, minimum: 0}
        finalGameWindowSeconds:
          type: integer
          minimum: 0
          description: |
            尾段“博弈时间”长度（秒）：截止前这段时间内 Agent 一律不得出价，只有真人可以。
            由服务端给出而不是让前端硬编码：窗口长度是运营配置（`AUCTION_FINAL_GAME_WINDOW_SECONDS`），
            前端只用它做“进入博弈时间”的提示，**不承担任何判定职责**——真正的拒绝对话发生在服务端事务内。
        serverTime: {type: string, format: date-time}
    BidRequest:
      type: object
      required: [requestId, amount]
      properties:
        requestId: {type: string, minLength: 8, maxLength: 128}
        amount: {type: integer, minimum: 1}
    BidResult:
      type: object
      required: [accepted, idempotent, price, extensions, seq, serverTime]
      properties:
        accepted: {type: boolean}
        idempotent: {type: boolean}
        price: {type: integer}
        leader: {type: string, nullable: true}
        extensions: {type: integer}
        seq: {type: integer}
        serverTime: {type: string, format: date-time}
    Bid:
      description: 一条已接受的出价记录。seq 单调递增，客户端据此检测事件缺口。
      type: object
      required: [id, userId, amount, requestId, seq, serverTime]
      properties:
        id: {type: string}
        userId: {type: string}
        amount: {type: integer, minimum: 1}
        requestId: {type: string}
        seq: {type: integer, minimum: 1}
        serverTime: {type: string, format: date-time}
    AuctionPage:
      type: object
      required: [items, page, size, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AuctionSnapshot'}}
        page: {type: integer, minimum: 1}
        size: {type: integer, minimum: 1}
        total: {type: integer, minimum: 0}
    BidPage:
      type: object
      required: [items, page, size, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Bid'}}
        page: {type: integer, minimum: 1}
        size: {type: integer, minimum: 1}
        total: {type: integer, minimum: 0}
    LedgerPage:
      type: object
      required: [items, page, size, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/LedgerEntry'}}
        page: {type: integer, minimum: 1}
        size: {type: integer, minimum: 1}
        total: {type: integer, minimum: 0}
    CreateAuctionRequest:
      type: object
      required: [title, startPrice, minIncrement, durationSeconds]
      properties:
        title: {type: string, minLength: 1, maxLength: 120}
        description: {type: string, maxLength: 2000}
        startPrice: {type: integer, minimum: 1}
        minIncrement: {type: integer, minimum: 1}
        durationSeconds: {type: integer, minimum: 10, maximum: 86400}
        # 可选预告开拍时间：填了就是“到点自动开拍”，不填就等管理员手动开始（D-35）。
        # 必须晚于**服务端数据库当前时间**，否则 400；不带时区的写法同样 400（歧义）。
        startsAt: {type: string, format: date-time, nullable: true}
    CreateAgentProxyRequest:
      type: object
      required: [auctionId, budgetLimit]
      properties:
        auctionId: {type: string}
        # 硬预算上限：跟价金额永不超过它，触顶后停止并提醒一次。
        # 上限由服务端另设天花板（当前 1000000）防呆。
        budgetLimit: {type: integer, minimum: 1, maximum: 1000000}
    AgentProxySummary:
      type: object
      required: [proxyId, ownerUserId, auctionId, status, auctionStatus, budgetLimit, bidCount, currentPrice, minIncrement, nextBidAmount, leading, budgetReached, createdAt, updatedAt]
      properties:
        proxyId: {type: string}
        ownerUserId: {type: string}
        auctionId: {type: string}
        auctionTitle: {type: string}
        auctionStatus: {$ref: '#/components/schemas/AuctionStatus'}
        status:
          type: string
          enum: [PENDING, BIDDING, BUDGET_REACHED, FINISHED, REVOKED]
          description: |
            PENDING=已创建未出价（未开拍或还没轮到它）· BIDDING=已进场在跟价 ·
            BUDGET_REACHED=到达预算上限已停手 · FINISHED=拍卖结束已收尾 · REVOKED=用户撤销
        budgetLimit: {type: integer, minimum: 1}
        bidCount: {type: integer, minimum: 0}
        lastBidAmount: {type: integer, nullable: true}
        # 下面四个是**拍卖的实时事实**（与拍卖快照同源），不是代理自己的记录：
        # 前端直接用它们解释“AI 现在在干什么”，不必再拉一次快照。
        currentPrice: {type: integer, minimum: 0}
        minIncrement: {type: integer, minimum: 1}
        nextBidAmount: {type: integer, minimum: 0}
        leading: {type: boolean}
        budgetReached: {type: boolean}
        won: {type: boolean, nullable: true}
        finalPrice: {type: integer, nullable: true}
        budgetReachedAt: {type: string, format: date-time, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        revokedAt: {type: string, format: date-time, nullable: true}
    AgentProxyPage:
      type: object
      required: [items, page, size, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AgentProxySummary'}}
        page: {type: integer, minimum: 1}
        size: {type: integer, minimum: 1}
        total: {type: integer, minimum: 0}
    CreateAgentTokenRequest:
      type: object
      required: [name, agentUserId, scopes, expiresAt]
      properties:
        name: {type: string, maxLength: 80}
        agentUserId: {type: string}
        # 省略 = 默认拒绝（D-29）：这枚 Token 对任何一场拍卖都无权访问，而不是“全部允许”。
        # 签发时允许为空，是为了不在契约层制造另一种“必填”错误：漏填范围的后果
        # 由 403 明确暴露，比“签发失败”更容易被发现是被授权范围写窄了。
        auctionIds: {type: array, items: {type: string}}
        scopes: {type: array, items: {type: string, enum: [auction:read, auction:bid]}}
        expiresAt: {type: string, format: date-time}
        # 省略则用服务端默认值（60/分钟）。上限是 6000：再高就不是限流而是摆设了。
        rateLimitPerMinute: {type: integer, minimum: 1, maximum: 6000, default: 60}
    CreateMyAgentTokenRequest:
      type: object
      required: [name, scopes, expiresAt]
      properties:
        name: {type: string, maxLength: 80}
        # 省略 = 默认拒绍（D-29），与管理员签发一致；没有 agentUserId，归属恒为本人。
        auctionIds: {type: array, items: {type: string}}
        scopes: {type: array, items: {type: string, enum: [auction:read, auction:bid]}}
        expiresAt: {type: string, format: date-time}
        rateLimitPerMinute: {type: integer, minimum: 1, maximum: 6000, default: 60}
    AgentTokenSummary:
      type: object
      required: [tokenId, name, agentUserId, status, scopes, auctionIds, rateLimitPerMinute, expiresAt, createdAt]
      properties:
        tokenId: {type: string}
        name: {type: string}
        agentUserId: {type: string}
        status:
          type: string
          enum: [ACTIVE, EXPIRED, REVOKED]
          description: 由服务端按当前时刻判定，与鉴权路径的 activeAt 同口径
        scopes: {type: array, items: {type: string, enum: [auction:read, auction:bid]}}
        auctionIds: {type: array, items: {type: string}}
        rateLimitPerMinute: {type: integer, minimum: 1}
        expiresAt: {type: string, format: date-time}
        revokedAt: {type: string, format: date-time, nullable: true}
        createdAt: {type: string, format: date-time}
    AgentTokenPage:
      type: object
      required: [items, page, size, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AgentTokenSummary'}}
        page: {type: integer, minimum: 1}
        size: {type: integer, minimum: 1}
        total: {type: integer, minimum: 0}
    Wallet:
      type: object
      required: [totalBalance, frozenAmount, availableBalance]
      properties:
        totalBalance: {type: integer}
        frozenAmount: {type: integer}
        availableBalance: {type: integer}
    LedgerEntry:
      type: object
      required: [id, actorType, type, amount, createdAt]
      properties:
        id: {type: string}
        actorType:
          type: string
          enum: [HUMAN, AGENT]
          description: |
            该笔资金动作的主体：HUMAN=真人，AGENT=竞拍 Agent。
            个人流水只返回本人的记录，因此这个字段不会泄露他人的主体身份。
        type: {type: string, enum: [FREEZE, RELEASE, SETTLE]}
        amount: {type: integer}
        auctionId: {type: string, nullable: true}
        requestId:
          type: string
          nullable: true
          description: |
            触发本条流水的那次请求的幂等键，用于把资金变动追回到具体出价/结算。
            结算产生的流水没有客户端请求，此处可能为空。
        createdAt: {type: string, format: date-time}
    ErrorData:
      type: object
      additionalProperties: true
    WsTicket:
      type: object
      required: [ticket, expiresAt, wsPath, wsPort]
      properties:
        ticket:
          type: string
          description: 一次性入场券。base64url、无填充，可直接放进查询串。
        expiresAt: {type: string, format: date-time}
        wsPath:
          type: string
          description: |
            连接路径模板，把 `{auctionId}` 换成目标拍品 ID。服务端给出而不是让前端硬编码：
            路径属于契约，改一次就该只改一处。
        wsPort:
          type: integer
          description: |
            WebSocket 监听的端口。它与 HTTP 端口**不同**（默认是 `WS_PORT`，没配时是 HTTP 端口 + 10000），
            因此必须由服务端告知，客户端不能拿它当 80/443 去拼。
    Participant: {type: object, properties: {auctionId: {type: string}, userId: {type: string}, joinedAt: {type: string, format: date-time}}}
    AuctionResult:
      type: object
      required: [auctionId, status, finalPrice, reason]
      properties:
        auctionId: {type: string}
        status: {$ref: '#/components/schemas/AuctionStatus'}
        winner: {type: string, nullable: true}
        winnerType:
          type: string
          enum: [HUMAN, AGENT]
          nullable: true
          description: |
            成交主体：HUMAN=真人，AGENT=竞拍 Agent；未成交时为 null。
            这是隐私字段——仅当请求者是赢家本人或管理员时才有值，其余一律为 null。
        finalPrice: {type: integer, minimum: 0}
        reason: {type: string, enum: [TIMEOUT, NO_BIDS, CANCELLED]}
        settledAt: {type: string, format: date-time, nullable: true}
    AgentToken: {type: object, properties: {token: {type: string}, tokenId: {type: string}, expiresAt: {type: string, format: date-time}}}
  responses:
    EnvelopeAuth: {description: OK, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/AuthData'}}}]}}}}
    EnvelopeWsTicket: {description: OK, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/WsTicket'}}}]}}}}
    EnvelopeUser: {description: OK, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/User'}}}]}}}}
    EnvelopeWallet: {description: OK, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/Wallet'}}}]}}}}
    EnvelopeLedgerPage: {description: OK, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/LedgerPage'}}}]}}}}
    EnvelopeAuction: {description: OK, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/AuctionSnapshot'}}}]}}}}
    EnvelopeAuctionPage: {description: OK, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/AuctionPage'}}}]}}}}
    EnvelopeBidPage: {description: OK, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/BidPage'}}}]}}}}
    EnvelopeBidResult: {description: OK, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/BidResult'}}}]}}}}
    EnvelopeResult: {description: OK, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/AuctionResult'}}}]}}}}
    EnvelopeParticipant: {description: OK, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/Participant'}}}]}}}}
    EnvelopeAgentToken: {description: Created; token is returned once, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/AgentToken'}}}]}}}}
    EnvelopeAgentTokenPage: {description: OK, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/AgentTokenPage'}}}]}}}}
    EnvelopeAgentProxy: {description: OK, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/AgentProxySummary'}}}]}}}}
    EnvelopeAgentProxyPage: {description: OK, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/AgentProxyPage'}}}]}}}}
    BadRequest: {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
    Unauthorized: {description: Authentication required, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
    Forbidden: {description: Permission denied, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
    NotFound: {description: Resource not found, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
    Conflict: {description: Business conflict such as BID_TOO_LOW, BID_LATE, NOT_JOINED, INVALID_STATE, or IDEMPOTENCY_REPLAY, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
    RateLimited: {description: Rate limited, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
